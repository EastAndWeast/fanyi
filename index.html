<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>视频字幕翻译器</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- 微信环境检测：微信内打开时显示引导页，提示用户用系统浏览器打开 -->
    <script>
      (function () {
        var ua = navigator.userAgent.toLowerCase();
        var isWeChat = ua.indexOf('micromessenger') > -1;
        // 排除 PC 端微信（PC 微信用的是 Chromium 内核，能正常运行）
        var isPC = ua.indexOf('windows nt') > -1 || ua.indexOf('macintosh') > -1;
        if (isWeChat && !isPC) {
          var html = ''
            + '<div style="position:fixed;inset:0;z-index:2147483647;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px;background:linear-gradient(160deg,#f0f7ff 0%,#ffffff 50%,#faf5ff 100%);font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;text-align:center;">'
            // 右上角箭头引导
            + '<div style="position:absolute;top:12px;right:16px;display:flex;flex-direction:column;align-items:center;">'
            + '<div style="font-size:13px;color:#6b7280;margin-bottom:4px;">点击右上角</div>'
            + '<svg width="32" height="32" viewBox="0 0 24 24" fill="none" style="transform:rotate(-30deg);"><path d="M3 12 L18 12 M12 6 L18 12 L12 18" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>'
            + '</div>'
            // 图标
            + '<div style="width:80px;height:80px;border-radius:20px;background:linear-gradient(135deg,#3b82f6,#8b5cf6);display:flex;align-items:center;justify-content:center;font-size:40px;margin-bottom:28px;box-shadow:0 12px 32px rgba(59,130,246,0.25);">'
            + '<svg width="40" height="40" viewBox="0 0 24 24" fill="none"><path d="M8 5v14l11-7L8 5z" fill="white"/></svg>'
            + '</div>'
            // 标题
            + '<h1 style="font-size:22px;font-weight:700;color:#1f2937;margin:0 0 8px 0;letter-spacing:0.5px;">请在浏览器中打开</h1>'
            + '<p style="font-size:15px;color:#6b7280;line-height:1.7;margin:0 0 32px 0;max-width:300px;">'
            + '视频字幕翻译需要使用浏览器的高级功能，<br/>微信内无法正常运行。'
            + '</p>'
            // 步骤
            + '<div style="background:white;border-radius:16px;padding:20px 24px;box-shadow:0 4px 16px rgba(0,0,0,0.06);max-width:300px;">'
            + '<div style="display:flex;align-items:flex-start;gap:12px;margin-bottom:12px;">'
            + '<span style="flex-shrink:0;width:24px;height:24px;border-radius:50%;background:#3b82f6;color:white;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;">1</span>'
            + '<span style="font-size:14px;color:#374151;line-height:1.5;flex:1;text-align:left;">点击屏幕<strong style="color:#3b82f6;">右上角 ···</strong></span>'
            + '</div>'
            + '<div style="display:flex;align-items:flex-start;gap:12px;">'
            + '<span style="flex-shrink:0;width:24px;height:24px;border-radius:50%;background:#3b82f6;color:white;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;">2</span>'
            + '<span style="font-size:14px;color:#374151;line-height:1.5;flex:1;text-align:left;">选择<strong style="color:#3b82f6;">在浏览器打开</strong></span>'
            + '</div>'
            + '</div>'
            + '<p style="font-size:12px;color:#9ca3af;margin:24px 0 0 0;">支持 Chrome、Edge、Safari 等主流浏览器</p>'
            + '</div>';
          document.body.innerHTML = '<div id="root"></div>';
          var overlay = document.createElement('div');
          overlay.innerHTML = html;
          document.body.appendChild(overlay);
          // 阻止后续脚本执行
          window.__WECHAT_BLOCKED__ = true;
        }
      })();
    </script>
    <!-- FFmpeg.wasm UMD 加载（必须用 UMD 而非 ESM，以确保 Worker 为 classic 类型） -->
    <script src="/ffmpeg/ffmpeg.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
